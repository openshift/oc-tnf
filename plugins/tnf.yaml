apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: tnf
spec:
  version: v0.0.8
  homepage: https://github.com/openshift/oc-tnf
  shortDescription: Validate STONITH fencing on TNF clusters
  description: |
    oc-tnf provides tooling for OpenShift Two Node with Fencing (TNF)
    clusters. The validate-fencing subcommand fences each cluster node
    sequentially via STONITH and verifies recovery, including Pacemaker
    rejoin and etcd quorum restoration.

    WARNING: validate-fencing is disruptive. It power-fences real nodes.
    Only run it against a TNF cluster you intend to test.
  caveats: |
    Requires SSH access to the cluster nodes (--ssh-key) and a valid
    kubeconfig for the TNF cluster. This plugin only works on OpenShift
    DualReplica (TNF) clusters.
  platforms:
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/openshift/oc-tnf/releases/download/v0.0.8/oc-tnf_linux_amd64.tar.gz
      sha256: "81f2346eac3c07e57fdef083c96a43d98e49f0655ce0ad6a0889c7f274b59602"
      bin: oc-tnf
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/openshift/oc-tnf/releases/download/v0.0.8/oc-tnf_linux_arm64.tar.gz
      sha256: "37489ad752fddfe6daa6667c9adef6cc74e7733eeeb33eeec1fbbbcc4bee1d40"
      bin: oc-tnf
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/openshift/oc-tnf/releases/download/v0.0.8/oc-tnf_darwin_amd64.tar.gz
      sha256: "79f3277579f9dda981af1b9b92d79f51597845f50385f5f3d8c39880aa292e2d"
      bin: oc-tnf
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/openshift/oc-tnf/releases/download/v0.0.8/oc-tnf_darwin_arm64.tar.gz
      sha256: "cc73c682865cd0f2aee8acc30484d52620241d34e35db4fd28555cccf4bcce1f"
      bin: oc-tnf
